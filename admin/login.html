<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Brikity</title>
    <link rel="icon" type="image/png" href="../assets/logo-brikity.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
    <style>
        :root { --bg:#121212; --surface:#1a1a1a; --text:#f8f9fa; --muted:#9ca3af; --orange:#ff4d00; --blue:#0066ff; --yellow:#ffd000; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(0,102,255,.2), transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255,77,0,.15), transparent 45%),
                var(--bg);
            color: var(--text);
            padding: 1rem;
        }
        .card {
            width: min(420px, 100%);
            background: rgba(26,26,26,.9);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 24px 60px rgba(0,0,0,.45);
        }
        .brand { text-align: center; margin-bottom: 1.5rem; }
        .brand img { width: 72px; height: 72px; object-fit: contain; margin: 0 auto 0.75rem; display: block; }
        .brand h1 { font-family: Syne, sans-serif; margin: 0; letter-spacing: .06em; }
        .brand p { color: var(--muted); margin: .35rem 0 0; font-size: .9rem; }
        label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
        input {
            width: 100%; padding: .75rem .9rem; margin-bottom: 1rem;
            border-radius: 12px; border: 1px solid rgba(255,255,255,.1);
            background: #111; color: var(--text); font: inherit;
        }
        input:focus { outline: none; border-color: var(--blue); }
        button {
            width: 100%; padding: .85rem; border: 0; border-radius: 12px;
            background: var(--orange); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .alert { padding: .75rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: .9rem; }
        .alert-error { background: rgba(255,77,0,.12); border: 1px solid rgba(255,77,0,.35); }
        .alert-ok { background: rgba(0,102,255,.12); border: 1px solid rgba(0,102,255,.3); }
        .hint {
            margin-top: 1rem; padding: .85rem 1rem; border-radius: 12px;
            background: rgba(255,208,0,.08); border: 1px solid rgba(255,208,0,.25);
            font-size: .82rem; color: var(--muted); line-height: 1.45;
        }
        .hint code { color: var(--yellow); font-size: .8rem; }
        .back { display: block; text-align: center; margin-top: 1rem; color: var(--muted); text-decoration: none; font-size: .85rem; }
        .back:hover { color: var(--yellow); }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="../assets/logo-brikity.png" alt="Brikity" />
            <h1>BRIKITY</h1>
            <p>Administration</p>
        </div>
        <div id="msg"></div>
        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required autocomplete="current-password" />
            <button type="submit" id="btn">Se connecter</button>
        </form>
        <div class="hint" id="demo-hint" hidden>
            <strong style="color:var(--yellow)">Mode démo (sans Firebase)</strong><br />
            Email : <code>admin@brikity.tn</code><br />
            Mot de passe : <code>brikity2026</code>
        </div>
        <a class="back" href="../index.html">← Retour au site</a>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { FIREBASE_CONFIG, isFirebaseConfigured } from "./firebase-config.js";
        import { assertIsAdmin } from "./require-admin.js";
        import { loginDemo, DEMO_ADMIN, isDemoLoggedIn } from "./local-db.js";

        const msg = document.getElementById("msg");
        const params = new URLSearchParams(location.search);
        if (params.get("error") === "not_admin") {
            msg.innerHTML = `<div class="alert alert-error">Compte non autorisé (admins allowlist).</div>`;
        }

        const demoMode = !isFirebaseConfigured();
        if (demoMode) {
            document.getElementById("demo-hint").hidden = false;
            document.getElementById("email").value = DEMO_ADMIN.email;
            document.getElementById("password").value = DEMO_ADMIN.password;
            if (isDemoLoggedIn()) location.href = "index.html";
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn");
            btn.disabled = true;
            msg.innerHTML = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                if (demoMode) {
                    const res = loginDemo(email, password);
                    if (!res.ok) throw new Error(res.error);
                    location.href = "index.html";
                    return;
                }

                const app = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
                const auth = getAuth(app);
                const db = getFirestore(app);
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const ok = await assertIsAdmin(auth, db, cred.user);
                if (!ok) {
                    msg.innerHTML = `<div class="alert alert-error">Pas dans la allowlist admins/{uid}.</div>`;
                    btn.disabled = false;
                    return;
                }
                location.href = "index.html";
            } catch (err) {
                msg.innerHTML = `<div class="alert alert-error">${err.message || "Connexion échouée"}</div>`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
